[project]
name = "schemai-builder"
version = "0.1.0"
description = "AI first electrical scheme builder with LLM and TTS"
readme = "README.md"
authors = [
    { name = "theMladyPan", email = "stanislav@rubint.sk" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
schemai-builder = "schemai_builder:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
